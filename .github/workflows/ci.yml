name: RAVANA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, 'auto/round-**']

# A new push to the same ref cancels the previous, still-running run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  # ubuntu-latest runners have 4 vCPUs; numeric libs must not oversubscribe
  # them or xdist workers fight each other for threads.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Hard offline switch for every CI job. Engine boot otherwise falls back to
  # auto-downloading glove.6B.zip (~822 MB) on a cache miss, which is what
  # previously hung the Windows soak job past its timeout with zero test output
  # and made ubuntu shards swing wildly in runtime. With this set a cache miss
  # degrades instantly to "no GloVe vectors" instead of stalling on the network.
  RAVANA_OFFLINE: "1"

jobs:
  # ── Warm GloVe cache (built once, shared via actions/cache) ──
  # The 144MB projected-vector cache (data/ravana_glove_cache.npz) used to be
  # tracked via Git LFS, which re-served it on every CI job and exhausted the
  # repo's 10GB LFS bandwidth quota. We now build it ONCE here (downloading the
  # ~822MB raw GloVe archive only on cache miss) and share it across all test
  # shards via actions/cache. This cuts LFS egress from ~1GB/run to a single
  # 822MB download per cache-population (rare).
  warm-glove-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # This job is the ONLY one allowed to fetch the raw GloVe archive.
      RAVANA_OFFLINE: "0"
      RAVANA_ALLOW_GLOVE_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          # Shallow clone: CI never needs full git history (the warm/build
          # scripts don't call git), so this cuts per-run checkout egress and
          # wall-clock. Also a defense-in-depth guard: a deep clone can never
          # pull an LFS object that a later commit accidentally re-tracks.
          fetch-depth: 1
      # Hard guard: fail the run if any tracked file is a Git-LFS pointer. The
      # repo's 10GB LFS bandwidth quota was historically exhausted by re-serving
      # a tracked asset on every CI job; if a future commit re-adds an LFS
      # filter, this catches it on the very next push instead of silently
      # re-draining the quota.
      - name: Guard — no Git-LFS tracked files
        shell: bash
        run: |
          if command -v git-lfs >/dev/null 2>&1; then
            tracked=$(git lfs ls-files 2>/dev/null | wc -l)
          else
            tracked=0
          fi
          if [ "${tracked:-0}" != "0" ]; then
            echo "FAIL: $tracked Git-LFS-tracked file(s) detected — this re-serves LFS bandwidth on every CI run."
            echo "Untrack the asset (git rm --cached + drop the .gitattributes filter) or move it to actions/cache."
            exit 1
          fi
          echo "OK: no Git-LFS tracked files."
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - name: Restore GloVe cache (or mark miss)
        id: glove-cache
        uses: actions/cache@v4
        with:
          path: data/ravana_glove_cache.npz
          key: glove-proj-cache-v1
      - name: Build GloVe cache if missing
        if: steps.glove-cache.outputs.cache-hit != 'true'
        run: python .github/scripts/warm_glove_cache.py
      - name: Verify cache present
        run: python .github/scripts/check_lfs_assets.py
      # Upload as a cross-OS artifact: actions/cache is OS-scoped, so the
      # windows-latest av-soak job cannot restore an ubuntu-built cache. The npz
      # is a plain numpy file (OS-independent), so an artifact bridges the gap.
      # Uploaded every run so the artifact is always fresh for av-soak (artifact
      # storage is NOT Git-LFS bandwidth, so this does not touch the quota).
      - name: Upload GloVe cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: glove-cache
          path: data/ravana_glove_cache.npz
          if-no-files-found: error
          retention-days: 7

  # ── Critical Path Tests (fast, runs on every push) ──
  # Excludes the AV BLAS soak (see av-soak job) so this job stays inside the
  # 10-minute budget and the fast path is not blocked by the Windows-only
  # stress test.
  ci-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [warm-glove-cache]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          # Shallow clone: CI never needs full git history (the warm/build
          # scripts don't call git), so this cuts per-run checkout egress and
          # wall-clock. Also a defense-in-depth guard: a deep clone can never
          # pull an LFS object that a later commit accidentally re-tracks.
          fetch-depth: 1
      - name: Restore GloVe cache
        uses: actions/cache@v4
        with:
          path: data/ravana_glove_cache.npz
          key: glove-proj-cache-v1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - name: Verify GloVe cache
        run: python .github/scripts/check_lfs_assets.py
      - name: Run CI-critical tests
        run: |
          mkdir -p data output checkpoints
          python -m pytest tests/ci/ -q --tb=short -x --ci \
            -k "not soak" \
            -n auto --dist worksteal --timeout=120

  # ── Unit Tests (sharded across runners, each shard uses xdist) ──
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [warm-glove-cache]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          # Shallow clone: CI never needs full git history (the warm/build
          # scripts don't call git), so this cuts per-run checkout egress and
          # wall-clock. Also a defense-in-depth guard: a deep clone can never
          # pull an LFS object that a later commit accidentally re-tracks.
          fetch-depth: 1
      - name: Restore GloVe cache
        uses: actions/cache@v4
        with:
          path: data/ravana_glove_cache.npz
          key: glove-proj-cache-v1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - name: Verify GloVe cache
        run: python .github/scripts/check_lfs_assets.py
      - name: Run unit tests (shard ${{ matrix.shard }}/4)
        run: |
          mkdir -p data output checkpoints
          python -m pytest tests/unit/ -q --tb=short \
            --splits 4 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration \
            -n auto --dist worksteal --timeout=180

  # ── Integration Tests (cross-module, slower) ──
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [warm-glove-cache]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          # Shallow clone: CI never needs full git history (the warm/build
          # scripts don't call git), so this cuts per-run checkout egress and
          # wall-clock. Also a defense-in-depth guard: a deep clone can never
          # pull an LFS object that a later commit accidentally re-tracks.
          fetch-depth: 1
      - name: Restore GloVe cache
        uses: actions/cache@v4
        with:
          path: data/ravana_glove_cache.npz
          key: glove-proj-cache-v1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - name: Verify GloVe cache
        run: python .github/scripts/check_lfs_assets.py
      - name: Run integration tests
        run: |
          mkdir -p data output checkpoints
          python -m pytest tests/integration/ -q --tb=short \
            -n auto --dist worksteal --timeout=240

  # ── Root-level suites not covered by the dirs above ──
  misc-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [warm-glove-cache]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          # Shallow clone: CI never needs full git history (the warm/build
          # scripts don't call git), so this cuts per-run checkout egress and
          # wall-clock. Also a defense-in-depth guard: a deep clone can never
          # pull an LFS object that a later commit accidentally re-tracks.
          fetch-depth: 1
      - name: Restore GloVe cache
        uses: actions/cache@v4
        with:
          path: data/ravana_glove_cache.npz
          key: glove-proj-cache-v1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - name: Verify GloVe cache
        run: python .github/scripts/check_lfs_assets.py
      - name: Run root-level tests
        run: |
          mkdir -p data output checkpoints
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/unit --ignore=tests/integration --ignore=tests/ci \
            -n auto --dist worksteal --timeout=120

  # ── AV BLAS soak (M0): 10 engine builds + hundreds of turns, Windows-only.
  # This is the thread-race stress test. It is gated to Windows and given a
  # 20-minute cap, with a per-test timeout well below the job cap so a hang is
  # reported as a test failure with a traceback rather than an opaque job-level
  # "exceeded maximum execution time" with no output.
  av-soak:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [warm-glove-cache]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          # Shallow clone: CI never needs full git history (the warm/build
          # scripts don't call git), so this cuts per-run checkout egress and
          # wall-clock. Also a defense-in-depth guard: a deep clone can never
          # pull an LFS object that a later commit accidentally re-tracks.
          fetch-depth: 1
      - name: Restore GloVe cache (cross-OS artifact from warm-glove-cache)
        uses: actions/download-artifact@v4
        with:
          name: glove-cache
          path: data
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - name: Verify GloVe cache
        shell: bash
        run: python .github/scripts/check_lfs_assets.py
      - name: Run AV soak (engine build + turns)
        shell: bash
        env:
          # Windows runners are ~3-4x slower per engine build than Linux. Six
          # rounds still exercises the thread-race across independent builds
          # while leaving generous headroom inside the 20-minute job cap.
          RAVANA_AV_SOAK_ROUNDS: "6"
        run: |
          mkdir -p data output checkpoints
          python -m pytest tests/ci/test_av_soak.py -q --tb=short \
            -p no:cacheprovider \
            --timeout=180 --timeout-method=thread --durations=10

  # ── Aggregate gate: one required status for branch protection ──
  ci-status:
    runs-on: ubuntu-latest
    needs: [ci-critical, unit-tests, integration-tests, misc-tests, av-soak]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more test jobs failed."
            exit 1
          fi
          echo "All test jobs passed."
