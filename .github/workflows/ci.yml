name: RAVANA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# A new push to the same ref cancels the previous, still-running run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  # ubuntu-latest runners have 4 vCPUs; numeric libs must not oversubscribe
  # them or xdist workers fight each other for threads.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ── Critical Path Tests (fast, runs on every push) ──
  # Excludes the 15-minute AV BLAS soak (see av-soak job) so this job stays
  # inside the 10-minute budget and the fast path is not blocked by the
  # Windows-only stress test.
  ci-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - name: Run CI-critical tests
        run: |
          mkdir -p data output checkpoints
          python -m pytest tests/ci/ -q --tb=short -x --ci \
            -k "not soak" \
            -n auto --dist worksteal --timeout=120

  # ── Unit Tests (sharded across runners, each shard uses xdist) ──
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - name: Run unit tests (shard ${{ matrix.shard }}/4)
        run: |
          mkdir -p data output checkpoints
          python -m pytest tests/unit/ -q --tb=short \
            --splits 4 --group ${{ matrix.shard }} \
            --splitting-algorithm least_duration \
            -n auto --dist worksteal --timeout=180

  # ── Integration Tests (cross-module, slower) ──
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - name: Run integration tests
        run: |
          mkdir -p data output checkpoints
          python -m pytest tests/integration/ -q --tb=short \
            -n auto --dist worksteal --timeout=240

  # ── Root-level suites not covered by the dirs above ──
  misc-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - name: Run root-level tests
        run: |
          mkdir -p data output checkpoints
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/unit --ignore=tests/integration --ignore=tests/ci \
            -n auto --dist worksteal --timeout=120

  # ── AV BLAS soak (M0): 50 engine builds + hundreds of turns, Windows-only.
  # This is the thread-race stress test; it is intentionally gated to the
  # Windows matrix and given a long timeout so it never blocks the fast path.
  av-soak:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]
      - name: Run AV soak (50x engine build + turns)
        shell: bash
        run: |
          mkdir -p data output checkpoints
          python -m pytest tests/ci/test_av_soak.py -q --tb=short --timeout=900

  # ── Aggregate gate: one required status for branch protection ──
  ci-status:
    runs-on: ubuntu-latest
    needs: [ci-critical, unit-tests, integration-tests, misc-tests, av-soak]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more test jobs failed."
            exit 1
          fi
          echo "All test jobs passed."
